name: OpenDisplay
options:
  bundleIdPrefix: me.talsa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  OpenDisplay:
    type: application
    platform: iOS
    sources:
      - path: OpenDisplay
    settings:
      base:
        PRODUCT_NAME: OpenDisplay
        PRODUCT_BUNDLE_IDENTIFIER: me.talsa.OpenDisplay
        INFOPLIST_FILE: OpenDisplay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  OpenDisplayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenDisplayTests
    dependencies:
      - target: OpenDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.talsa.OpenDisplayTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenDisplay.app/OpenDisplay
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  OpenDisplay:
    build:
      targets:
        OpenDisplay: all
        OpenDisplayTests: [test]
    test:
      config: Debug
      targets:
        - OpenDisplayTests
